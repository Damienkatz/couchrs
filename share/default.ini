; couchdb-rs default configuration. Every setting below is one couchdb-rs
; reads. Local changes belong in local.ini (or the last --ini file), which
; overrides this file and is where changes made over the _config API are
; saved. Syntax and section names follow CouchDB's default.ini.

[couchdb]
; Generated on first start and saved to the write file.
;uuid =
; Create the users and replicator databases at start.
single_node = true
; Security of new databases: admin_only (members and admins are server
; admins) or everyone (open).
default_security = admin_only
; Whether the users database's _security object may be changed.
users_db_security_editable = false

[chttpd]
port = 5984
bind_address = 127.0.0.1
; Refuse anonymous requests (except to _up with the _except_for_up form).
require_valid_user = false
require_valid_user_except_for_up = false
; _all_dbs and _dbs_info are for server admins only.
admin_only_all_dbs = true
; Tried in order: cookie (AuthSession), default (Basic), proxy, jwt.
authentication_handlers = cookie, default

[chttpd_auth]
; Signs AuthSession cookies; generated on first start and saved if unset.
;secret =
; Seconds an AuthSession cookie stays valid; it is renewed after 10%.
timeout = 600
; Cookies carry Expires and Max-Age (else they end with the browser).
allow_persistent_cookies = true
;cookie_domain =
;same_site =
;secure_cookie = false
; HMACs for AuthSession cookies: the first signs, all are accepted.
hash_algorithms = sha256, sha
; Where users live (org.couchdb.user:NAME documents).
authentication_db = _users
; User doc fields anyone may read, comma separated.
;public_fields =
; Requirements for new passwords, e.g. [{".{10,}", "At least 10 characters"}].
;password_regexp =
; Proxy authentication: the headers a trusted proxy sets, and whether it
; must also send x_auth_token = hex HMAC-SHA256(secret, username).
;x_auth_username = X-Auth-CouchDB-UserName
;x_auth_roles = X-Auth-CouchDB-Roles
;x_auth_token = X-Auth-CouchDB-Token
;proxy_use_secret = false
; New admin passwords are hashed with PBKDF2 using these settings.
password_scheme = pbkdf2
pbkdf2_prf = sha256
iterations = 600000

[admins]
; name = password
; Plaintext passwords are replaced by their hash on start and when set over
; the _config API. With no admins the server is in "admin party" mode.

[jwt_auth]
; Claims a token must carry: exp, iat, nbf, kid, typ, and {iss, "value"}.
required_claims = exp
; Where roles are: a top-level claim name, or a dotted path into nested
; claims (\. for a literal dot) when roles_claim_path is set.
roles_claim_name = _couchdb.roles
;roles_claim_path =

[jwt_keys]
; hmac:KID = base64 secret, rsa:KID or ec:KID = PEM (newlines as \n);
; KID is _default for tokens without a kid header.

[stats]
; Seconds of history in the histograms of _stats and _prometheus.
interval = 10

[prometheus]
; Also serve /_node/_local/_prometheus, without authentication, on its own
; port (read at start).
additional_port = false
bind_address = 127.0.0.1
port = 17986

[mango]
; Warn when a query examines more than this many docs per result (0: never).
index_scan_warning_threshold = 10

[smoosh]
; Automatic compaction. Channels beyond the built-in upgrade_dbs,
; ratio_dbs, slack_dbs (and _views), and index_cleanup, by name:
;db_channels =
;view_channels =
;cleanup_channels =
; Minutes before something queued is considered again.
staleness = 5
; Seconds after start before any channel compacts.
wait_secs = 30
; Remove index files no design doc uses when a view is compacted.
cleanup_index_files = true
; Keep channel queues across restarts, in state_dir (default: the data
; directory).
persist = false
;state_dir =
; Log level of compaction messages: debug, info, warning, error.
;compaction_log_level = info

; Per channel, in [smoosh.CHANNEL]: priority (ratio, slack or upgrade, for
; channels not built in), min_priority (2.0 for ratio, 536870912 bytes for
; slack), max_priority, min_size (1048576), max_size, min_changes (dbs),
; concurrency (1), capacity (9999), and from/to ("HH:MM" UTC) for when it
; may start compactions.

[smoosh.ignore]
; DBNAME = true to never compact a database automatically.

[ken]
; Background indexing: index updates at once, and more for indexes
; less than max_incremental_updates changes behind.
batch_channels = 20
incremental_channels = 80
max_incremental_updates = 1000

[ken.ignore]
; DBNAME = true to never index a database in the background.

[replicator]
; Scheduling: jobs running at once, how often jobs are swapped (ms), how
; many each time, history kept per job, and how long (seconds) a job must
; run before a crash no longer counts toward its backoff.
max_jobs = 500
interval = 60000
max_churn = 20
max_history = 20
health_threshold = 120
; Per replication (a replication doc can set these too): workers, docs
; per batch, connections, timeout (ms), retries, checkpoints.
worker_processes = 4
worker_batch_size = 500
http_connections = 20
connection_timeout = 30000
retries_per_request = 5
use_checkpoints = true
use_bulk_get = true
checkpoint_interval = 30000
; Random delay (ms) before a job starts.
startup_jitter = 5000
; Seconds after start before replicator databases are read.
cluster_start_period = 5
; Also write triggered/error states into replication docs.
update_docs = false
valid_endpoint_protocols = http,https
valid_proxy_protocols = http,https,socks5
; https endpoints: check their certificates (against this CA bundle),
; and present a client certificate.
verify_ssl_certificates = false
;ssl_trusted_certificates_file =
;cert_file =
;key_file =
; Doc ids longer than this are skipped (and counted as write failures).
;max_document_id_length = infinity
; Wait before refetching a doc the source unexpectedly lacked (ms).
missing_doc_retry_msec = 2000
; Endpoint auth, tried in order: couch_replicator_auth_session logs in at
; _session and sends its cookie (refreshed after session_refresh_interval_sec
; when the cookie has no Max-Age); couch_replicator_auth_noop is basic auth.
auth_plugins = couch_replicator_auth_session,couch_replicator_auth_noop
session_refresh_interval_sec = 550
; Fair share decay: how fast past usage and job priorities fade (0.0-1.0).
usage_coeff = 0.5
priority_coeff = 0.98

[replicator.shares]
; DBNAME = 1..1000: a replicator db's share of running jobs (default 100).

[ssl]
; HTTPS on its own port, alongside HTTP.
enable = false
port = 6984
; PEM certificate (chain) and unencrypted key.
;cert_file =
;key_file =
; Check clients' certificates against this CA bundle, and whether one is
; required.
;cacert_file =
verify_ssl_certificates = false
fail_if_no_peer_cert = false
; Versions offered, e.g. [tlsv1.2, tlsv1.3] (default: both).
;tls_versions =

[attachments]
; New attachments of these types are stored gzipped (level 1-9, 0 never),
; and served so to clients that accept gzip.
compression_level = 8
compressible_types = text/*, application/javascript, application/json, application/xml

[csp]
; The Content-Security-Policy header attachments are served with.
attachments_enable = true
attachments_header_value = sandbox
