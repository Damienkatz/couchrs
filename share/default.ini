; couchdb-rs default configuration. Every setting below is one couchdb-rs
; reads. Local changes belong in local.ini (or the last --ini file), which
; overrides this file and is where changes made over the _config API are
; saved. Syntax and section names follow CouchDB's default.ini.

[couchdb]
; Generated on first start and saved to the write file.
;uuid =

[chttpd]
port = 5984
bind_address = 127.0.0.1

[chttpd_auth]
; Signs AuthSession cookies; generated on first start and saved if unset.
;secret =
; Seconds an AuthSession cookie stays valid.
timeout = 600
; New admin passwords are hashed with PBKDF2 using these settings.
password_scheme = pbkdf2
pbkdf2_prf = sha256
iterations = 600000

[admins]
; name = password
; Plaintext passwords are replaced by their hash on start and when set over
; the _config API. With no admins the server is in "admin party" mode.
