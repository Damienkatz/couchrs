[package]
name = "couchdb-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
bincode = "1"
bytes = "1.12.1"
crc32fast = "1.5.3"
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
form_urlencoded = "1.2.2"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
icu_collator = "2.3.1"
include_dir = "0.7.4"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
libc = "0.2.191"
lz4_flex = "0.14.0"
md-5 = "0.11.0"
mime = "0.3.17"
multer = "3.1.0"
p521 = { version = "0.14.0", features = ["ecdsa", "pem"] }
parking_lot = "0.12.5"
pbkdf2 = "0.13.0"
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "socks", "http2"] }
rocksdb = { version = "0.25.0", default-features = false, features = ["bindgen-runtime", "multi-threaded-cf"] }
rquickjs = "0.14.0"
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
snap = "1.1.2"
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
tantivy-stemmers = { version = "0.4.0", default-features = false, features = ["arabic", "armenian_mkrtchyan", "basque", "catalan", "czech_dolamic_light", "danish", "dutch", "english_porter", "finnish", "french", "german", "hindi_lightweight", "hungarian", "indonesian_tala", "irish_gaelic", "italian", "norwegian_bokmal", "portuguese", "romanian", "russian", "spanish", "swedish", "turkish_cilden"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
