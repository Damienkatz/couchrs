[package]
name = "couchdb-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
bincode = "1"
bytes = "1.12.1"
crc32fast = "1.5.3"
form_urlencoded = "1.2.2"
futures = "0.3.34"
hex = "0.4.3"
http-body-util = "0.1.5"
icu_collator = "2.3.1"
libc = "0.2.191"
lz4_flex = "0.14.0"
md-5 = "0.11.0"
mime = "0.3.17"
multer = "3.1.0"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
snap = "1.1.2"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
