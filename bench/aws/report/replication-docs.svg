<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" role="img" aria-label="Replication rate">
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,.12)}
.title{font-size:15px;font-weight:600;fill:#0b0b0b}
.sub{font-size:12px;fill:#6f6e69}
.leg{font-size:12.5px;fill:#52514e}
.lbl{font-size:12.5px;fill:#52514e}
.val{font-size:11.5px;fill:#52514e;font-variant-numeric:tabular-nums}
.ratio{font-size:12px;font-weight:600;fill:#0b0b0b;font-variant-numeric:tabular-nums}
.tick{font-size:11px;fill:#6f6e69;font-variant-numeric:tabular-nums}
.grid{stroke:#e1e0d9}
.axis{stroke:#c3c2b7}
.s-erlang{fill:#2a78d6}
.s-couchrs{fill:#eda100}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,.12)}
.title,.ratio{fill:#f0efec}
.sub,.tick{fill:#9a9890}
.leg,.lbl,.val{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#45453f}
.s-erlang{fill:#3987e5}
.s-couchrs{fill:#c98500}
}
</style>
<rect x="0.5" y="0.5" width="759" height="169" rx="10" class="bg"/>
<text x="18" y="33" class="title">Replication rate</text>
<text x="18" y="52" class="sub">docs/s · higher is better</text>
<rect x="18" y="64" width="10" height="10" rx="2" class="s-erlang"/>
<text x="34" y="74" class="leg">CouchDB (Erlang)</text>
<rect x="171.2" y="64" width="10" height="10" rx="2" class="s-couchrs"/>
<text x="187.2" y="74" class="leg">CouchRS (hybrid)</text>
<line x1="114.0" x2="114.0" y1="92" y2="134" class="grid"/>
<text x="114.0" y="150" text-anchor="middle" class="tick">0</text>
<line x1="257.5" x2="257.5" y1="92" y2="134" class="grid"/>
<text x="257.5" y="150" text-anchor="middle" class="tick">1.0K</text>
<line x1="401.0" x2="401.0" y1="92" y2="134" class="grid"/>
<text x="401.0" y="150" text-anchor="middle" class="tick">2.0K</text>
<line x1="544.5" x2="544.5" y1="92" y2="134" class="grid"/>
<text x="544.5" y="150" text-anchor="middle" class="tick">3.0K</text>
<line x1="688.0" x2="688.0" y1="92" y2="134" class="grid"/>
<text x="688.0" y="150" text-anchor="middle" class="tick">4.0K</text>
<line x1="114" x2="114" y1="92" y2="134" class="axis"/>
<text x="104" y="117" text-anchor="end" class="lbl">Documents</text>
<path d="M114.0,101.0 H442.4 Q446.4,101.0 446.4,105.0 V108.0 Q446.4,112.0 442.4,112.0 H114.0 Z" class="s-erlang"/>
<text x="452.4" y="110.5" class="val">2.3K</text>
<path d="M114.0,114.0 H677.7 Q681.7,114.0 681.7,118.0 V121.0 Q681.7,125.0 677.7,125.0 H114.0 Z" class="s-couchrs"/>
<text x="687.7" y="123.5" class="val">4.0K</text>
</svg>
