<svg xmlns="http://www.w3.org/2000/svg" width="760" height="135" viewBox="0 0 760 135" role="img" aria-label="Incremental index update, CouchRS">
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,.12)}
.title{font-size:15px;font-weight:600;fill:#0b0b0b}
.sub{font-size:12px;fill:#6f6e69}
.leg{font-size:12.5px;fill:#52514e}
.lbl{font-size:12.5px;fill:#52514e}
.val{font-size:11.5px;fill:#52514e;font-variant-numeric:tabular-nums}
.ratio{font-size:12px;font-weight:600;fill:#0b0b0b;font-variant-numeric:tabular-nums}
.tick{font-size:11px;fill:#6f6e69;font-variant-numeric:tabular-nums}
.grid{stroke:#e1e0d9}
.axis{stroke:#c3c2b7}
.s-erlang{fill:#2a78d6}
.s-couchrs{fill:#eda100}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,.12)}
.title,.ratio{fill:#f0efec}
.sub,.tick{fill:#9a9890}
.leg,.lbl,.val{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#45453f}
.s-erlang{fill:#3987e5}
.s-couchrs{fill:#c98500}
}
</style>
<rect x="0.5" y="0.5" width="759" height="134" rx="10" class="bg"/>
<text x="18" y="33" class="title">Incremental index update, CouchRS</text>
<text x="18" y="52" class="sub">seconds to index 200,000 changed docs · lower is better</text>
<line x1="114.0" x2="114.0" y1="70" y2="99" class="grid"/>
<text x="114.0" y="115" text-anchor="middle" class="tick">0</text>
<line x1="257.5" x2="257.5" y1="70" y2="99" class="grid"/>
<text x="257.5" y="115" text-anchor="middle" class="tick">2</text>
<line x1="401.0" x2="401.0" y1="70" y2="99" class="grid"/>
<text x="401.0" y="115" text-anchor="middle" class="tick">4</text>
<line x1="544.5" x2="544.5" y1="70" y2="99" class="grid"/>
<text x="544.5" y="115" text-anchor="middle" class="tick">6</text>
<line x1="688.0" x2="688.0" y1="70" y2="99" class="grid"/>
<text x="688.0" y="115" text-anchor="middle" class="tick">8</text>
<line x1="114" x2="114" y1="70" y2="99" class="axis"/>
<text x="104" y="95" text-anchor="end" class="lbl">Per round</text>
<path d="M114.0,79.0 H584.6 Q588.6,79.0 588.6,83.0 V86.0 Q588.6,90.0 584.6,90.0 H114.0 Z" class="s-couchrs"/>
<text x="594.6" y="88.5" class="val">6.62</text>
</svg>
