<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-label="CouchRS speed relative to CouchDB">
<style>
svg{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{fill:#fcfcfb;stroke:rgba(11,11,11,.12)}
.title{font-size:15px;font-weight:600;fill:#0b0b0b}
.sub{font-size:12px;fill:#6f6e69}
.leg{font-size:12.5px;fill:#52514e}
.lbl{font-size:12.5px;fill:#52514e}
.val{font-size:11.5px;fill:#52514e;font-variant-numeric:tabular-nums}
.ratio{font-size:12px;font-weight:600;fill:#0b0b0b;font-variant-numeric:tabular-nums}
.tick{font-size:11px;fill:#6f6e69;font-variant-numeric:tabular-nums}
.grid{stroke:#e1e0d9}
.axis{stroke:#c3c2b7}
.s-erlang{fill:#2a78d6}
.s-couchrs{fill:#eda100}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19;stroke:rgba(255,255,255,.12)}
.title,.ratio{fill:#f0efec}
.sub,.tick{fill:#9a9890}
.leg,.lbl,.val{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#45453f}
.s-erlang{fill:#3987e5}
.s-couchrs{fill:#c98500}
}
</style>
<rect x="0.5" y="0.5" width="759" height="449" rx="10" class="bg"/>
<text x="18" y="33" class="title">CouchRS (hybrid) speed relative to CouchDB</text>
<text x="18" y="52" class="sub">each bar starts at 1× (parity); right of it, CouchRS is faster</text>
<line x1="194.0" x2="194.0" y1="70" y2="414" class="grid"/>
<text x="194.0" y="430" text-anchor="middle" class="tick">0×</text>
<line x1="285.2" x2="285.2" y1="70" y2="414" class="grid"/>
<text x="285.2" y="430" text-anchor="middle" class="tick">2×</text>
<line x1="376.4" x2="376.4" y1="70" y2="414" class="grid"/>
<text x="376.4" y="430" text-anchor="middle" class="tick">4×</text>
<line x1="467.6" x2="467.6" y1="70" y2="414" class="grid"/>
<text x="467.6" y="430" text-anchor="middle" class="tick">6×</text>
<line x1="558.8" x2="558.8" y1="70" y2="414" class="grid"/>
<text x="558.8" y="430" text-anchor="middle" class="tick">8×</text>
<line x1="650.0" x2="650.0" y1="70" y2="414" class="grid"/>
<text x="650.0" y="430" text-anchor="middle" class="tick">10×</text>
<line x1="239.6" x2="239.6" y1="70" y2="414" class="axis" stroke-width="1.5"/>
<text x="182" y="91.0" text-anchor="end" class="lbl">Bulk load (MB/s)</text>
<rect x="239.6" y="82.0" width="361.1" height="10" rx="3" class="s-couchrs"/>
<text x="606.7" y="91.0" class="ratio">8.9×</text>
<text x="182" y="117.0" text-anchor="end" class="lbl">PUT 1 KB (ops/s)</text>
<rect x="239.6" y="108.0" width="131.2" height="10" rx="3" class="s-couchrs"/>
<text x="376.8" y="117.0" class="ratio">3.9×</text>
<text x="182" y="143.0" text-anchor="end" class="lbl">PUT 10 MB (MB/s)</text>
<rect x="239.6" y="134.0" width="337.6" height="10" rx="3" class="s-couchrs"/>
<text x="583.2" y="143.0" class="ratio">8.4×</text>
<text x="182" y="169.0" text-anchor="end" class="lbl">PUT 1 GB (MB/s)</text>
<rect x="239.6" y="160.0" width="404.6" height="10" rx="3" class="s-couchrs"/>
<text x="650.2" y="169.0" class="ratio">9.9×</text>
<text x="182" y="195.0" text-anchor="end" class="lbl">GET 1 KB (ops/s)</text>
<rect x="239.6" y="186.0" width="114.0" height="10" rx="3" class="s-couchrs"/>
<text x="359.6" y="195.0" class="ratio">3.5×</text>
<text x="182" y="221.0" text-anchor="end" class="lbl">GET 10 MB (MB/s)</text>
<rect x="239.6" y="212.0" width="29.3" height="10" rx="3" class="s-couchrs"/>
<text x="274.9" y="221.0" class="ratio">1.6×</text>
<text x="182" y="247.0" text-anchor="end" class="lbl">DELETE 1 KB (ops/s)</text>
<rect x="239.6" y="238.0" width="174.4" height="10" rx="3" class="s-couchrs"/>
<text x="420.0" y="247.0" class="ratio">4.8×</text>
<text x="182" y="273.0" text-anchor="end" class="lbl">View build (docs/s)</text>
<rect x="239.6" y="264.0" width="375.9" height="10" rx="3" class="s-couchrs"/>
<text x="621.5" y="273.0" class="ratio">9.2×</text>
<text x="182" y="299.0" text-anchor="end" class="lbl">View key lookup (q/s)</text>
<rect x="239.6" y="290.0" width="72.5" height="10" rx="3" class="s-couchrs"/>
<text x="318.1" y="299.0" class="ratio">2.6×</text>
<text x="182" y="325.0" text-anchor="end" class="lbl">View reduce (q/s)</text>
<rect x="239.6" y="316.0" width="392.5" height="10" rx="3" class="s-couchrs"/>
<text x="638.1" y="325.0" class="ratio">9.6×</text>
<text x="182" y="351.0" text-anchor="end" class="lbl">Replication (time)</text>
<rect x="239.6" y="342.0" width="32.3" height="10" rx="3" class="s-couchrs"/>
<text x="277.9" y="351.0" class="ratio">1.7×</text>
<text x="182" y="377.0" text-anchor="end" class="lbl">Compaction (time)</text>
<rect x="239.6" y="368.0" width="144.9" height="10" rx="3" class="s-couchrs"/>
<text x="390.5" y="377.0" class="ratio">4.2×</text>
<text x="182" y="403.0" text-anchor="end" class="lbl">View compaction (time)</text>
<rect x="239.6" y="394.0" width="41.7" height="10" rx="3" class="s-couchrs"/>
<text x="287.3" y="403.0" class="ratio">1.9×</text>
</svg>
