[package]
name = "couchbench"
version = "0.1.0"
edition = "2024"
description = "Stress/benchmark load generator for CouchDB-compatible servers"

[dependencies]
bytes = "1.12.1"
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }

[profile.release]
debug = false
